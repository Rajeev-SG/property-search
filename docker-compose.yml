services:
  postgres:
    image: postgres:16
    container_name: property-search-postgres
    environment:
      POSTGRES_DB: property_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: property-search-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  typesense:
    image: typesense/typesense:29.0
    container_name: property-search-typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: xyz
      TYPESENSE_ENABLE_CORS: "true"
    command: "--data-dir /data --api-key=xyz --enable-cors"
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
